<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨</title>
<link rel="stylesheet" href="../src/player.css">
<style>
  html, body { margin: 0; background: #f4efe4; color: #1f1d1a; font-family: 'Kaiti SC', 'STKaiti', serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 24px 120px; }
  header p { color: #6b665c; font-size: 14px; line-height: 1.8; margin: 0 0 40px; }
  section { margin: 0 0 56px; }
  section small { display: block; margin: 6px 0 0 64px; color: #8d877b; font-size: 12.5px; }
  .refused { font: 12px/1.7 ui-monospace, monospace; color: #8a2a22; white-space: pre-wrap; }
</style></head>
<body><main>
<header><p>空白，一个圆。点圆，写出来；再点，收回去。点右上的印位，钤印留下。<br>每一幅都是一份 JSON 脚本：examples/ 是示例，trials/ 是模型试写的。<br><a href="avatar.html" style="color:inherit">活的头像（灵）→</a></p></header>
<div id="list"></div>
</main>
<script type="module">
import { mount, validate } from '../src/index.js';
const list = document.getElementById('list');
const paths = await (await fetch('/scripts.json')).json();
const got = await Promise.all(paths.map(async (path) => (await fetch(path)).json()));
for (const [i, path] of paths.entries()) {
  const script = got[i];
  const section = document.createElement('section');
  list.append(section);
  const result = validate(script);
  if (!result.ok) { section.innerHTML = `<div class="refused">${path} 被拒：\n${result.errors.join('\n')}</div>`; continue; }
  const key = `shuimo:${script.id}`;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) ?? '{}'); } catch {}
  const save = (patch) => { saved = { ...saved, ...patch }; try { localStorage.setItem(key, JSON.stringify(saved)); } catch {} };
  // 留下的，下次打开就在；没留下的，从空开始。
  mount(section, script, { autoplay: false, state: saved.kept ? saved.state : undefined, kept: saved.kept, onState: (state) => save({ state }), onKeep: (kept) => save({ kept }) });
  const note = document.createElement('small');
  note.textContent = `${path.slice(1)}　${script.intent ?? ''}`;
  section.append(note);
}
</script></body></html>
