<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨</title>
<link rel="stylesheet" href="../src/player.css">
<style>
  :root { --paper: #f4efe4; --ink: #1f1d1a; --faint: #8d877b; --line: #ddd5c4; --cinnabar: #b5352b; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; font-family: 'TsangerJinKai02', 'Kaiti SC', 'STKaiti', 'KaiTi', serif; -webkit-font-smoothing: antialiased; user-select: none; }
  /* 一张纸：660 × 412，整张放大到一屏（一般是两倍）。纸上的东西少而大。 */
  #stage { position: absolute; left: 50%; top: 50%; width: 660px; height: 412px; transform-origin: 0 0; }
  #trail { position: absolute; left: 0; top: 0; pointer-events: none; }
  .at { position: absolute; }
  #me { position: absolute; cursor: grab; touch-action: none; z-index: 5; }
  #me.held { cursor: grabbing; }
  #sheet { position: absolute; z-index: 4; }

  /* 它说的话：大字，一个字一个字写出来。 */
  #say { left: 44px; bottom: 44px; font-size: 19px; letter-spacing: 0.1em; height: 26px; white-space: nowrap; }
  #say span { opacity: 0; filter: blur(1.4px); transition: opacity 260ms ease-out, filter 340ms ease-out; }
  #say span.w { opacity: 1; filter: none; }
  #say.dry span { opacity: 0; transition: opacity 380ms ease-in; }
  #hint { left: 45px; bottom: 26px; font-size: 8.5px; color: var(--faint); letter-spacing: 0.14em; transition: opacity 500ms; }

  /* 主人的话：竖排，从右往左，像题在画边的字。可以把它放上去，也可以直接点。 */
  #words { right: 40px; top: 58px; display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 0; opacity: 0; transition: opacity 900ms; }
  #words.on { opacity: 1; }
  #words.away { opacity: 0; pointer-events: none; }
  #words h2 { writing-mode: vertical-rl; margin: 0 2px 0 9px; font-size: 6.5px; font-weight: 400; color: var(--faint); letter-spacing: 0.5em; padding-top: 2px; }
  #words h2:not(:first-child) { margin-right: 16px; }
  .word { all: unset; box-sizing: border-box; cursor: pointer; writing-mode: vertical-rl; font-size: 10.5px; letter-spacing: 0.16em; line-height: 1; padding: 0 5.5px 12px; position: relative; color: #6a655c; transition: color 250ms; white-space: nowrap; }
  .word::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: transparent; transition: background 250ms; }
  .word.model::after { background: color-mix(in srgb, var(--cinnabar) 45%, transparent); }
  .word:hover, .word.over, .word.now { color: var(--ink); }
  .word.over::after, .word.now::after { background: var(--cinnabar); }

  /* 题：一个「墨」字。把它放上来，它会围着这个字合成一个圈。 */
  h1 { margin: 0; width: 22px; height: 22px; font-size: 20px; line-height: 22px; text-align: center; font-weight: 400; transition: opacity 500ms ease, filter 700ms ease; }
  h1.calls { opacity: 0.45; }
  h1.pale { opacity: 0.14; filter: blur(1.2px); }
  #sub { transition: left 900ms cubic-bezier(.2,.7,.2,1); }
  .faint { color: var(--faint); font-size: 6.5px; letter-spacing: 0.16em; }
  a, .link { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; }
  #json { left: 44px; top: 70px; width: 250px; max-height: 250px; overflow: auto; margin: 0; padding: 8px 10px; box-sizing: border-box; background: rgba(255, 253, 247, 0.95); border: 0.5px solid var(--line); font: 5px/1.6 ui-monospace, 'SF Mono', Menlo, monospace; color: #4a463f; white-space: pre-wrap; word-break: break-all; display: none; z-index: 8; user-select: text; }
  #json.on { display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="trail"></canvas>
  <h1 class="at" id="logo" style="left:44px;top:26px">墨</h1>
  <div class="at faint" id="sub" style="left:74px;top:39px">pneuma-shuimo</div>
  <div class="at faint" style="right:40px;top:36px"><a href="board.html">全部案例</a>　<span class="link" id="showJson">看它写的脚本</span></div>
  <div class="at faint" style="right:40px;bottom:26px" id="legend">朱点：这一句的脚本是模型只凭 skill 写的</div>

  <div id="sheet"></div>
  <div id="me"></div>

  <div class="at" id="words"></div>
  <div class="at" id="say"></div>
  <div class="at" id="hint"></div>
  <pre class="at" id="json"></pre>
</div>

<script type="module">
import { summon, mount, validate, validatePiece, Paper, DENSITY, lay } from '../src/index.js';

// ── 纸 ──
const stage = document.getElementById('stage');
const W = 660, H = 412, SIZE = 56;
let S = Math.min(innerWidth / W, innerHeight / H);
DENSITY.boost = Math.min(3, S);           // 放大了看，墨也要按放大后的像素来画
const fit = () => { S = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${S}) translate(-50%, -50%)`; };
addEventListener('resize', fit); fit();
const local = (e) => { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const any = (list) => list[Math.floor(Math.random() * list.length)];
const json = async (path) => (await fetch(path)).json();

// ── 它会的：小品，和主人说过的话 ──
const pieces = {};
for (const path of await json('/pieces.json')) { const p = await json(path); if (validatePiece(p).ok) pieces[p.id] = p; }
const scripts = {};
for (const path of await json('/scripts.json')) { const s = await json(path); if (validate(s).ok) scripts[s.id] = s; }
const hoverPieces = Object.values(pieces).filter((p) => p.occasion === 'hover' && p.id !== 'roll-about');

const WORDS = [
  { head: '对它说一句' },
  { say: '帮我记每天喝了几杯水', grow: 'water' },
  { say: '每天早上，我要做三件事', grow: 'morning' },
  { say: '明天有雨，别让我忘了带伞', grow: 'umbrella' },
  { say: '这周想去三次健身房', grow: 'gym', model: true },
  { head: '或者，让它自己玩' },
  { say: '闲着的时候，钓会儿鱼吧', play: 'fishing', model: true },
  { say: '我最近迷上喝茶了', play: 'tea-leaf', model: true },
  { say: '困了就睡一会儿', play: 'sleeping-cat' },
  { say: '什么也别想', blank: true },
].filter((w) => w.head || w.blank || (w.grow && scripts[w.grow]) || (w.play && pieces[w.play]));

// ── 主角 ──
const me = document.getElementById('me');
const HOME = { x: 196, y: 148 };     // 纸的中间偏左
const DESK = { x: 42, y: 78 };      // 它写东西的地方：右边和下边留得出一张纸
let pos = { ...HOME };
const place = () => { me.style.left = `${pos.x}px`; me.style.top = `${pos.y}px`; };
place();
const spirit = summon(me, { size: SIZE, pieces: hoverPieces, idle: false });

// 它走过的那一笔，写在整张纸上。
const trail = new Paper(document.getElementById('trail'));
trail.resize(W, H);
const INK = getComputedStyle(stage).color;
const marks = new Set();
let frame = 0;
const tick = (now) => {
  frame = 0;
  for (const m of marks) {
    m.mark.written = Math.max(m.mark.written, Math.min(1, (now - m.t0) / m.dur));
    const gone = now < m.dryAt ? 0 : Math.min(1, (now - m.dryAt) / m.dryDur);
    m.mark.opacity = 1 - gone;
    if (gone >= 1) { trail.remove(m.mark); marks.delete(m); }
  }
  trail.draw();
  if (marks.size) frame = requestAnimationFrame(tick);
};
/** 它自己去别处：圆在原处干去，一笔扫过去，在那里重新写出来。它从不滑过去。 */
async function travel(to, arrive = 560) {
  const a = { x: pos.x + SIZE / 2, y: pos.y + SIZE / 2 }, b = { x: to.x + SIZE / 2, y: to.y + SIZE / 2 };
  const far = Math.hypot(b.x - a.x, b.y - a.y);
  if (far < 12) return;
  const ux = (b.x - a.x) / far, uy = (b.y - a.y) / far;
  const bow = Math.min(60, far * 0.16) * (b.x > a.x ? -1 : 1);
  const from = [a.x + ux * 22, a.y + uy * 22], end = [b.x - ux * 20, b.y - uy * 20];
  const mid = [(a.x + b.x) / 2 - uy * bow, (a.y + b.y) / 2 + ux * bow];
  const dur = Math.min(900, 380 + far * 1.3);
  const now = performance.now();
  // 离开时还按着，中间提起来写干，快到时再按下去。
  const def = { path: [from, [(from[0] + mid[0]) / 2 - uy * bow * 0.4, (from[1] + mid[1]) / 2 + ux * bow * 0.4], mid, [(mid[0] + end[0]) / 2 - uy * bow * 0.4, (mid[1] + end[1]) / 2 + ux * bow * 0.4], end], width: 7.5, press: [[0, 0.75], [0.12, 1], [0.5, 0.3], [0.86, 0.5], [1, 0.9]], ink: 0.92, wet: 0.22, dry: 0.95, liberty: 'sweep' };
  marks.add({ mark: trail.add(lay(def, 1 + Math.floor(Math.random() * 1e9)), INK), t0: now, dur, dryAt: now + dur * 0.75, dryDur: 900 });
  if (!frame) frame = requestAnimationFrame(tick);
  spirit.dryAway(420);
  await wait(dur * 0.8);
  pos = { ...to }; place();
  spirit.rewrite(arrive);
  await wait(arrive + 60);
}

// ── 它说话 ──
const sayEl = document.getElementById('say'), hintEl = document.getElementById('hint');
let saying = 0;
async function say(text, hint = '') {
  const my = ++saying;
  sayEl.classList.add('dry');
  hintEl.style.opacity = 0;
  await wait(sayEl.textContent ? 300 : 0);
  if (my !== saying) return;
  sayEl.classList.remove('dry');
  sayEl.textContent = '';
  [...text].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; sayEl.append(s); setTimeout(() => { if (my === saying) s.classList.add('w'); }, 40 + i * 70); });
  hintEl.textContent = hint;
  setTimeout(() => { if (my === saying) hintEl.style.opacity = hint ? 1 : 0; }, 300 + [...text].length * 70);
  await wait(200 + [...text].length * 70);
}

// ── 它听懂的话 ──
const wordsEl = document.getElementById('words');
const legend = document.getElementById('legend');
legend.style.transition = 'opacity 600ms';
const jsonEl = document.getElementById('json');
const showScript = (obj) => { jsonEl.textContent = obj ? JSON.stringify(obj, null, 1).replace(/\[\s+(-?[\d.]+),\s+(-?[\d.]+)\s+\]/g, '[$1, $2]') : '它还没写什么。'; };
showScript(null);
document.getElementById('showJson').onclick = () => jsonEl.classList.toggle('on');
for (const w of WORDS) {
  if (w.head) { const h = document.createElement('h2'); h.textContent = w.head; wordsEl.append(h); continue; }
  const b = document.createElement('button');
  b.className = `word${w.model ? ' model' : ''}`; b.type = 'button';
  b.textContent = `「${w.say}」`;
  b.onclick = () => { touched(); hear(w); };
  w.el = b;
  wordsEl.append(b);
}

// ── 合：把它放到左上角的「墨」字上，它围着这个字写成一个整圈，和题合为一体 ──
const logo = document.getElementById('logo'), sub = document.getElementById('sub');
const LOGO = { x: 44 + 11 - SIZE / 2, y: 26 + 11 - SIZE / 2 };      // 它的圆心正落在字心上
const nearLogo = (x, y) => Math.hypot(x - LOGO.x, y - LOGO.y) < 34;
let merged = null;    // 合着的时候：{ seal, turn }
async function merge() {
  const my = ++turn;
  spirit.set('still');
  await fold(true);
  logo.classList.remove('calls');
  logo.classList.add('pale');                       // 字先淡下去，把地方让出来
  sub.style.left = '92px';
  say('合。');
  await travel(LOGO, 1500);                          // 一笔过去，围着字慢慢写一整圈
  if (my !== turn) { logo.classList.remove('pale'); return; }
  logo.classList.remove('pale');                     // 圈写成了，字的墨回来
  spirit.ink({ path: [[49, 50], [51.5, 50.6]], width: 58, press: 'dot', ink: 0.13, wet: 1, dry: 0, liberty: 'still' }, { dur: 500, stays: 900 });   // 圈里晕开一层淡墨
  const rim = [-80, -68, -52, -36, -24].map((d) => [50 + 33 * Math.cos((d * Math.PI) / 180), 50 + 33 * Math.sin((d * Math.PI) / 180)]);
  const seal = spirit.ink({ path: rim, width: 10, press: 'plain', ink: 0.95, wet: 0.5, dry: 0.35, liberty: 'calm' }, { after: 520, dur: 460 });   // 最后一笔，把口合上
  merged = { seal };
  await wait(1100);
  if (my === turn) say('我就是墨。', '按住这个圈，可以再把我带出来。');
}
function unmerge() {
  if (!merged) return;
  merged.seal.dry(350); merged = null;
  logo.classList.remove('pale');
  sub.style.left = '74px';
  spirit.set('rest');
}

let sheet = null;     // 它写出来、还在纸上的那一样
let turn = 0;         // 每一件事占一个回合；回合过了，没做完的就停手
const done = { hover: false, carry: false, word: false, use: false, fold: false };
const mark = (w) => WORDS.forEach((x) => x.el?.classList.toggle('now', x === w));

/** 收回去：纸上的东西干回圆里。 */
async function fold(quiet = false) {
  if (!sheet) return;
  const s = sheet; sheet = null;
  s.fold();
  wordsEl.classList.remove('away'); legend.style.opacity = 1;
  spirit.rewrite(600);
  mark(null);
  if (!quiet) say('从圆里来，回圆里去。');
  await wait(900);
  s.destroy();
}

/** 主人说了一句话。 */
async function hear(w) {
  const my = ++turn;
  const alive = () => my === turn;
  done.word = true;
  unmerge();
  spirit.set('rest'); spirit.giveWay();
  await fold(true);
  if (!alive()) return;
  mark(w);
  say(`「${w.say}」`);
  await wait(500);
  if (w.blank) {
    await travel(HOME); if (!alive()) return;
    spirit.set('blank'); showScript(null);
    await say('放空。', '墨淡到只剩一道痕；过一阵，我再把自己写回来。');
    return;
  }
  if (w.play) {
    const piece = pieces[w.play];
    await travel(HOME); if (!alive()) return;
    spirit.set('thinking'); await say('我想想。'); await wait(1900); if (!alive()) return;
    spirit.set('rest'); await wait(700); if (!alive()) return;
    showScript(piece);
    say(`「${piece.name}」`, piece.answer ? '它在的时候，把指针放到我身上试试。' : '这一段是一份 JSON：几笔，什么时候写，什么时候干。');
    spirit.play(piece, 'leisure', { hold: piece.occasion === 'leisure' ? 5000 : 900 });
    while (alive() && spirit.busy) await wait(300);
    if (alive()) { mark(null); say('演完了。', '想再看，再点一次。'); }
    return;
  }
  const script = { ...scripts[w.grow], resets: 'never' };
  await travel(DESK); if (!alive()) return;
  spirit.set('thinking'); await say('我想想。'); await wait(2100); if (!alive()) return;
  spirit.set('working'); await say('在写。'); await wait(2300); if (!alive()) return;
  spirit.done(); await wait(1900); if (!alive()) return;
  showScript(script);
  const el = document.getElementById('sheet');
  el.style.left = `${pos.x + SIZE / 2 - 30}px`; el.style.top = `${pos.y + SIZE / 2 - 34}px`;
  wordsEl.classList.add('away'); legend.style.opacity = 0;
  sheet = mount(el, script, { circle: false, onState: () => { if (!done.use) { done.use = true; say('它是真的。', '用完了，点一下我，它就收回去。'); } }, onKeep: (k) => say(k ? '钤了印，它就留下了。' : '印取掉了。') });
  await wait(sheet.plan.usable + 300); if (!alive()) return;
  say('写出来了。', done.use ? '点一下我，它就收回去。' : '它是真的：点一点试试。');
}

// ── 拖：带着走只是位置跟手，形不变；放到一句话上，就是对它说了这句话 ──
let held = null;
const wordAt = (x, y) => WORDS.find((w) => { if (!w.el) return false; const r = w.el.getBoundingClientRect(), s = stage.getBoundingClientRect(); const l = (r.left - s.left) / S, t = (r.top - s.top) / S; return x > l - 3 && x < l + r.width / S + 3 && y > t - 30 && y < t + r.height / S + 10; });
me.addEventListener('pointerdown', (e) => {
  touched();
  const p = local(e);
  held = { dx: p.x - pos.x, dy: p.y - pos.y, x0: p.x, y0: p.y, moved: false, tx: pos.x, ty: pos.y };
  me.setPointerCapture(e.pointerId);
});
me.addEventListener('pointermove', (e) => {
  if (!held) return;
  const p = local(e);
  if (!held.moved && Math.hypot(p.x - held.x0, p.y - held.y0) > 4) {
    held.moved = true; me.classList.add('held');
    const was = merged;
    turn += 1; unmerge(); spirit.set('rest'); fold(true);
    if (was) say('出来了。'); else if (!done.carry) say('带我去哪？', '放到右边的一句话上；或者随便放个地方。');
    follow();
  }
  held.tx = Math.max(4, Math.min(W - SIZE - 4, p.x - held.dx)); held.ty = Math.max(4, Math.min(H - SIZE - 4, p.y - held.dy));
  if (held.moved) { const w = wordAt(held.tx + SIZE / 2, held.ty + SIZE / 2); WORDS.forEach((x) => x.el?.classList.toggle('over', x === w)); logo.classList.toggle('calls', nearLogo(held.tx, held.ty)); }
});
const follow = () => { if (!held) return; pos.x += (held.tx - pos.x) * 0.32; pos.y += (held.ty - pos.y) * 0.32; place(); requestAnimationFrame(follow); };
me.addEventListener('pointerup', async () => {
  if (!held) return;
  const h = held; held = null; me.classList.remove('held');
  WORDS.forEach((x) => x.el?.classList.remove('over'));
  if (!h.moved) {                    // 只是点了一下
    if (sheet) { done.fold = true; fold(); }
    return;
  }
  pos.x = h.tx; pos.y = h.ty; place();
  done.carry = true;
  if (nearLogo(pos.x, pos.y)) { merge(); return; }
  const w = wordAt(pos.x + SIZE / 2, pos.y + SIZE / 2);
  if (w) { hear(w); return; }
  say('好，我就待在这儿。', '左上角那个「墨」字，也可以把我放上去。');
});

// ── 它看得见指针：指针在附近，它点一个睛看过去 ──
let eye = { on: false, angle: 0, at: 0 };
stage.addEventListener('pointermove', (e) => {
  if (held || merged || spirit.busy || spirit.state !== 'rest') return;
  const p = local(e);
  const dx = p.x - (pos.x + SIZE / 2), dy = p.y - (pos.y + SIZE / 2), far = Math.hypot(dx, dy);
  const now = performance.now();
  if (far < SIZE * 0.6) { eye.on = false; return; }      // 在它身上：它自己会看（summon 自带）
  if (far > 150) { if (eye.on) { spirit.unlook(); eye.on = false; } return; }
  const angle = Math.atan2(dy, dx);
  const turned = Math.abs(Math.atan2(Math.sin(angle - eye.angle), Math.cos(angle - eye.angle)));
  if (!eye.on || (turned > 0.75 && now - eye.at > 650)) { spirit.look(dx, dy); eye = { on: true, angle, at: now }; }
});
me.addEventListener('pointerenter', () => { touched(); if (!done.hover && spirit.state === 'rest' && !sheet) { done.hover = true; say('我看见你了。', '停一下别动，我给你演一小段。'); } });

// ── 没人理它的时候：它过自己的日子，也顺便把自己介绍一遍 ──
let last = performance.now();
let self = true;                       // 还没人碰过它：它自己演示
function touched() { last = performance.now(); self = false; }
stage.addEventListener('pointerdown', touched);
const demoWords = WORDS.filter((w) => w.grow || w.play);
let demoAt = 0;
async function life() {
  await wait(900);
  await say('我是墨。', '一张纸，一个圆。圆就是我。');
  await wait(2600);
  wordsEl.classList.add('on');
  await say('我是活的。', '把指针移过来；按住我，可以带着我走。');
  for (;;) {
    await wait(1000);
    const quiet = performance.now() - last;
    if (held || merged || spirit.busy || document.hidden || spirit.state === 'still') continue;
    if (self && quiet > 6500 && spirit.state === 'rest' && !sheet) {
      // 没人来：它自己挑一句话做给你看，做完收回去。
      const w = demoWords[demoAt++ % demoWords.length];
      await say('没人说话，我自己来。'); await wait(900);
      const my = turn + 1;
      await hear(w);
      if (turn !== my) continue;
      await wait(w.grow ? 5200 : 1200);
      if (turn !== my || !self) continue;
      await fold(); await wait(1200);
      if (turn !== my) continue;
      await travel(HOME);
      last = performance.now() - 2500;
      continue;
    }
    if (!self && quiet > 16000 && spirit.state === 'rest' && !sheet) {
      // 有人来过，又走开了：它闲着，自己画点什么。
      const piece = any(Object.values(pieces).filter((p) => p.occasion === 'leisure' && p.id !== 'mend-the-gap'));
      turn += 1; mark(null);
      showScript(piece);
      say('闲着。', `「${piece.name}」　这时候把指针放上来，它会回应。`);
      spirit.play(piece, 'leisure', { hold: 5000 });
      last = performance.now() + 20000;
    }
  }
}
life();
</script>
</body>
</html>
